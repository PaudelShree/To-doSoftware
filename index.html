<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Application</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .todo-container {
            max-width: 600px;
            margin: 0 auto;
            padding-top: 50px;
        }
        .task-completed {
            text-decoration: line-through;
            color: grey;
        }
        .task-buttons {
            margin-left: 10px;
        }
        .task-delete {
            color: red;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="todo-container">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="card-title text-center">Todo List</h3>
            <form id="todoForm">
                <div class="input-group">
                    <input type="text" id="taskInput" class="form-control" placeholder="Add a task" required>
                    <button class="btn btn-primary" type="submit">Add Task</button>
                </div>
            </form>
            <ul id="taskList" class="list-group mt-4">
                <!-- Tasks will be added here -->
            </ul>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS and Popper -->
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>

<script>
    // Fetch tasks from localStorage on page load
    document.addEventListener('DOMContentLoaded', loadTasks);

    const todoForm = document.getElementById('todoForm');
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');

    // Handle Add Task
    todoForm.addEventListener('submit', function(e) {
        e.preventDefault();
        const taskText = taskInput.value.trim();
        if (taskText) {
            addTask(taskText);
            taskInput.value = '';
        }
    });

    // Add a task
    function addTask(taskText) {
        const task = {
            id: new Date().getTime(),
            text: taskText,
            completed: false
        };
        const tasks = getTasksFromLocalStorage();
        tasks.push(task);
        saveTasksToLocalStorage(tasks);
        renderTask(task);
    }

    // Render a task in the list
    function renderTask(task) {
        const li = document.createElement('li');
        li.classList.add('list-group-item', 'd-flex', 'justify-content-between', 'align-items-center');
        if (task.completed) {
            li.classList.add('task-completed');
        }
        li.dataset.id = task.id;

        li.innerHTML = `
            <span class="task-text">${task.text}</span>
            <div class="task-buttons">
                <button class="btn btn-sm btn-success" onclick="toggleTaskCompletion(${task.id})">
                    ${task.completed ? 'Undo' : 'Complete'}
                </button>
                <span class="task-delete" onclick="deleteTask(${task.id})">&times;</span>
            </div>
        `;
        taskList.appendChild(li);
    }

    // Get tasks from localStorage
    function getTasksFromLocalStorage() {
        return JSON.parse(localStorage.getItem('tasks')) || [];
    }

    // Save tasks to localStorage
    function saveTasksToLocalStorage(tasks) {
        localStorage.setItem('tasks', JSON.stringify(tasks));
    }

    // Load tasks from localStorage and display them
    function loadTasks() {
        const tasks = getTasksFromLocalStorage();
        tasks.forEach(task => renderTask(task));
    }

    // Toggle task completion
    function toggleTaskCompletion(taskId) {
        const tasks = getTasksFromLocalStorage();
        const task = tasks.find(t => t.id === taskId);
        task.completed = !task.completed;
        saveTasksToLocalStorage(tasks);
        reloadTasks();
    }

    // Delete a task
    function deleteTask(taskId) {
        const tasks = getTasksFromLocalStorage();
        const filteredTasks = tasks.filter(t => t.id !== taskId);
        saveTasksToLocalStorage(filteredTasks);
        reloadTasks();
    }

    // Reload tasks after an update
    function reloadTasks() {
        taskList.innerHTML = '';
        loadTasks();
    }
</script>

</body>
</html>
