<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App by Shree Paudel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
        }

        .container {
            margin-top: 50px;
        }

        .todo-item {
            background-color: #ffffff;
            border-radius: 5px;
            padding: 10px;
            margin: 5px 0;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .todo-item.completed {
            text-decoration: line-through;
            background-color: #d3ffd3;
        }

        .btn-edit {
            background-color: #ffc107;
        }

        .btn-delete {
            background-color: #dc3545;
        }

        .btn-complete {
            background-color: #28a745;
        }

        .btn-complete,
        .btn-edit,
        .btn-delete {
            color: white;
        }

        input[type="text"] {
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 class="text-center mb-4">To-do List</h1>

        <!-- Add Todo Form -->
        <div class="mb-4">
            <input type="text" id="taskInput" class="form-control" placeholder="Add a new task">
            <button class="btn btn-primary mt-2 w-100" id="addTaskBtn">Add Task</button>
        </div>

        <!-- Todo List -->
        <ul id="todoList" class="list-group"></ul>
    </div>

    <script>
        // Get elements
        const taskInput = document.getElementById('taskInput');
        const addTaskBtn = document.getElementById('addTaskBtn');
        const todoList = document.getElementById('todoList');

        // Load tasks from localStorage
        let tasks = JSON.parse(localStorage.getItem('tasks')) || [];

        // Display tasks
        function displayTasks() {
            todoList.innerHTML = '';
            tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.classList.add('list-group-item', 'todo-item', task.completed ? 'completed' : '');
                li.innerHTML = `
                    <span class="task-text">${task.text}</span>
                    <button class="btn btn-complete btn-sm ms-2" onclick="markComplete(${index})">✓</button>
                    <button class="btn btn-edit btn-sm ms-2" onclick="editTask(${index})">Edit</button>
                    <button class="btn btn-delete btn-sm ms-2" onclick="deleteTask(${index})">Delete</button>
                `;
                todoList.appendChild(li);
            });
        }

        // Add a task
        function addTask() {
            const taskText = taskInput.value.trim();
            if (taskText !== '') {
                tasks.push({ text: taskText, completed: false });
                taskInput.value = '';
                saveTasks();
                displayTasks();
            }
        }

        // Mark a task as complete
        function markComplete(index) {
            tasks[index].completed = !tasks[index].completed;
            saveTasks();
            displayTasks();
        }

        // Edit a task
        function editTask(index) {
            const newText = prompt('Edit your task:', tasks[index].text);
            if (newText !== null && newText.trim() !== '') {
                tasks[index].text = newText.trim();
                saveTasks();
                displayTasks();
            }
        }

        // Delete a task
        function deleteTask(index) {
            tasks.splice(index, 1);
            saveTasks();
            displayTasks();
        }

        // Save tasks to localStorage
        function saveTasks() {
            localStorage.setItem('tasks', JSON.stringify(tasks));
        }

        // Event listeners
        addTaskBtn.addEventListener('click', addTask);
        taskInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                addTask();
            }
        });

        // Initial call to display tasks
        displayTasks();
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
